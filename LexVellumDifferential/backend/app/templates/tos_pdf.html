<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Helvetica', 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 40px;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .title {
            font-size: 20px;
            margin-top: 10px;
            color: #555;
        }
        .content {
            white-space: pre-wrap;
            font-size: 12px;
            text-align: justify;
        }
        .footer {
            margin-top: 50px;
            font-size: 10px;
            text-align: center;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .meta {
            font-size: 12px;
            margin-bottom: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">LexVellum Differential</div>
        <div class="title">Updated Terms of Service</div>
    </div>

    <div class="meta">
        <strong>Document ID:</strong> {{ doc_id }}<br>
        <strong>Status:</strong> {{ status }}<br>
        <strong>Date:</strong> {{ date }}<br>
        <strong>Approved By:</strong> {{ lawyer_name }}
    </div>

    <div class="content">
{{ text }}
    </div>

    <div class="footer">
        Generated by LexVellum Differential AI Compliance Engine. 
        This document is for informational purposes and does not constitute legal advice.
    </div>
</body>
</html>
